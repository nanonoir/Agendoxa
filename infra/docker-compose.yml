name: agendoxa

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agendoxa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendoxa_local}
      POSTGRES_DB: ${POSTGRES_DB:-agendoxa}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: agendoxa_test
      POSTGRES_PASSWORD: agendoxa_test
      POSTGRES_DB: agendoxa_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:

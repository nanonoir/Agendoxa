        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrmBookingRequest'
            examples:
              walkInNewCustomer:
                $ref: '#/components/examples/CreateCrmBookingRequest'
      responses:
        '201':
          description: Booking created, CONFIRMED or PENDING_PAYMENT_REVIEW.
          headers:

      additionalProperties: false
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
      additionalProperties: false
    BookingSummary:
      type: object
      required: [id, status, origin, customer, attendeeName, service, resource, startAt, endAt, agreedPrice, requiredDeposit, depositState, supplementalDepositState, pendingOperationalClose, holdExpiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/BookingStatus'
        origin:
          type: string
          enum: [WHATSAPP, CRM]
        customer:
          type: object
          required: [id, fullName]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            fullName:
              type: [string, 'null']
          additionalProperties: false
        attendeeName:
          type: [string, 'null']
        service:
          $ref: '#/components/schemas/NamedRef'
        resource:
          $ref: '#/components/schemas/NamedRef'
        startAt:
          description: From the active claim, or the last one for a released booking.
          allOf:
            - $ref: '#/components/schemas/Instant'
        endAt:
          $ref: '#/components/schemas/Instant'
        agreedPrice:
          $ref: '#/components/schemas/Money'
        requiredDeposit:
          description: |
            Deposit required by the conditions that currently apply to the booking, computed by the
            backend (BR-SEN-05); null when none applies. After a reschedule it is the requirement of
            the destination's conditions, not a sum: the initial requirement is `deposit.required`
            of the financial state and the shortfall is `supplementalDeposit.required` (API-DM-21).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        depositState:
          $ref: '#/components/schemas/DepositState'
        supplementalDepositState:
          description: Null when no supplement is requested. Separate from depositState so a supplement never reads as an unconfirmed booking.
          oneOf:
            - $ref: '#/components/schemas/SupplementalDepositState'
            - type: 'null'
        pendingOperationalClose:
          description: CONFIRMED and already ended; derived, not a status (BR-RES-13).
          type: boolean
        holdExpiresAt:
          description: Never extended by a replacement or rescreening; may be past while timely evidence is still screened; the processing margin is in BR-SEN-16 and INV-SEN-03.
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
      additionalProperties: false
    BookingDetail:
      type: object
      required: [booking, attendeePhone, noticeMinutes, depositRefundPolicy, blockedException, depositException, createdByMembershipId, cancelReason, createdAt, updatedAt]
      properties:
        booking:
          $ref: '#/components/schemas/BookingSummary'
        attendeePhone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        noticeMinutes:
          description: Notice snapshot applied to this booking.
          allOf:
            - $ref: '#/components/schemas/Minutes'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        blockedException:
          type: boolean
        depositException:
          type: boolean
        createdByMembershipId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        cancelReason:
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    BookingPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BookingSummary'
    BookingEvent:
      type: object
      required: [id, eventType, fromStatus, toStatus, actorKind, actorMembershipId, reason, lateChangeKind, occurredAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        eventType:
          type: string
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/BookingStatus'
            - type: 'null'
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/BookingStatus'
            - type: 'null'
        actorKind:
          type: string
          enum: [CUSTOMER, MEMBER, AI, SYSTEM]
        actorMembershipId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reason:
          type: [string, 'null']
        lateChangeKind:
          type: [string, 'null']
          enum: [LATE_CANCELLATION, LATE_RESCHEDULE, null]
        occurredAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    BookingEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingEvent'
      additionalProperties: false
    AgendaView:
      type: object
      required: [from, to, timezone, resources, bookings, exceptions]
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        timezone:
          type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        bookings:
          description: Occupying and terminal bookings in range; EXPIRED and CANCELLED are omitted.
          type: array
          items:
            $ref: '#/components/schemas/BookingSummary'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityException'
      additionalProperties: false
    CustomerInput:
      description: An existing customer, or the data to create one in the same operation.
      oneOf:
        - type: object
          required: [customerId]
          properties:
            customerId:
              $ref: '#/components/schemas/Uuid'
          additionalProperties: false
        - type: object
          required: [newCustomer]
          properties:
            newCustomer:
              $ref: '#/components/schemas/CreateCustomerRequest'
          additionalProperties: false
    AdminException:
      description: Admin-only, non-delegable; the reason is recorded (BR-IAM-04).
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
    CreateCrmBookingRequest:
      description: '`deposit` and `depositException` are mutually exclusive; sending both is a validation error.'
      type: object
      required: [customer, serviceId, resourceId, startAt]
      dependentSchemas:
        deposit:
          properties:
            depositException: false
      properties:
        customer:
          $ref: '#/components/schemas/CustomerInput'
        attendeeName:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
        attendeePhone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        serviceId:
          $ref: '#/components/schemas/Uuid'
        resourceId:
          description: Null assigns any compatible resource with the tenant's assignment mode.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        startAt:
          description: The end comes from the service duration (BR-RES-02).
          allOf:
            - $ref: '#/components/schemas/Instant'
        acknowledgeBlockedCustomer:
          description: Required as true to book a BLOCKED customer after the internal warning (BR-CLI-09).
          type: boolean
          default: false
        depositException:
          description: Admin confirms without the required deposit; the reason is optional (BR-SEN-09). Not combinable with `deposit`.
          type: object
          properties:
            reason:
              type: [string, 'null']
              maxLength: 500
          additionalProperties: false
        deposit:
          $ref: '#/components/schemas/DepositInput'
      additionalProperties: false
    DepositInput:
      description: |
        Verified funds explicitly allocated to the new booking's charge, evidence for human review,
        or both (BR-SEN-09). At least one of `evidence` or a non-empty `allocations` is required;
        `declaredAmount` is accepted only together with `evidence` and is never proof of credit.
        Both together are two routes, not two credits. Threshold met: CONFIRMED. Evidence, or
        verified funds below the threshold: PENDING_PAYMENT_REVIEW, occupying (UNDER_REVIEW or
        PARTIAL). Allocations need `payments.allocate`, evidence `payments.record` (API-DM-08).
      type: object
      anyOf:
        - required: [evidence]
        - required: [allocations]
      dependentRequired:
        declaredAmount: [evidence]
      properties:
        allocations:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/DepositAllocationItem'
        evidence:
          $ref: '#/components/schemas/EvidenceInput'
        declaredAmount:
          description: Amount the customer says they transferred; never proof of credit. Only with `evidence`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
      additionalProperties: false
    DepositAllocationItem:
      description: Allocates part of an existing verified payment to the charge the booking creates.
      type: object
      required: [paymentId, amount]
      properties:
        paymentId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
      additionalProperties: false
    CancelBookingRequest:
      type: object
      required: [cause]
      properties:
        cause:
          type: string
          enum: [CUSTOMER_REQUEST, BUSINESS_OPERATIONAL]
        reason:
          description: Required when cause is BUSINESS_OPERATIONAL (BR-CAN-06).
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'
        acceptLateConsequence:
          description: The customer accepted the stated late consequence (BR-CAN-14).
          type: boolean
          default: false
        adminException:
          $ref: '#/components/schemas/AdminException'
      additionalProperties: false
    RescheduleBookingRequest:
      type: object
      required: [cause, startAt]
      properties:
        cause:
          type: string
          enum: [CUSTOMER_REQUEST, BUSINESS_OPERATIONAL]
        startAt:
          $ref: '#/components/schemas/Instant'
        resourceId:
          description: Omit to keep the current resource.
          $ref: '#/components/schemas/Uuid'
        serviceId:
          description: Omit to keep the current service.
          $ref: '#/components/schemas/Uuid'
        acceptLateConsequence:
          type: boolean
          default: false
        adminException:
          description: For a late consequence or the reschedule limit (BR-CAN-03, CU-09 A1b).
          $ref: '#/components/schemas/AdminException'
      additionalProperties: false
    RescheduleResult:
      description: |
        The moved booking and, when the destination's current requirement exceeds what the valid
        allocations cover, the supplement requested for the shortfall. Every field is present;
        `supplementalDeposit` is null when no supplement is requested (API-DM-03). Assembled by the
        coordinator from the participants' results in the same transaction (API-DM-25).
      type: object
      required: [booking, previousSlot, lateChange, supplementalDeposit]
      properties:
        booking:
          $ref: '#/components/schemas/BookingDetail'
        previousSlot:
          type: object
          required: [resourceId, startAt, endAt]
          properties:
            resourceId:
              $ref: '#/components/schemas/Uuid'
            startAt:
              $ref: '#/components/schemas/Instant'
            endAt:
              $ref: '#/components/schemas/Instant'
          additionalProperties: false
        lateChange:
          type: boolean
        supplementalDeposit:
          description: |
            The shortfall of the destination's current requirement over the valid allocations
            (BR-CAN-10), requested after the move; null when nothing is missing, including when the
            destination requires less (nothing is refunded or credited, BR-CAN-11). The booking stays
            CONFIRMED either way.
          oneOf:
            - $ref: '#/components/schemas/SupplementalDeposit'
            - type: 'null'
      additionalProperties: false
    RecordOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [COMPLETED, NO_SHOW]
      additionalProperties: false
    CorrectOutcomeRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          enum: [COMPLETED, NO_SHOW]
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
    RemainderWalkInRequest:
      description: '`deposit` and `depositException` are mutually exclusive, as in CreateCrmBookingRequest.'
      type: object
      required: [customer, serviceId, startAt]
      dependentSchemas:
        deposit:
          properties:
            depositException: false
      properties:
        customer:
          $ref: '#/components/schemas/CustomerInput'
        attendeeName:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
        serviceId:
          $ref: '#/components/schemas/Uuid'
        startAt:
          description: Must fit inside the private remainder of the original booking's resource.
          allOf:
            - $ref: '#/components/schemas/Instant'
        acknowledgeBlockedCustomer:
          type: boolean
          default: false
        depositException:
          description: As in CreateCrmBookingRequest; Admin only.
          type: object
          properties:
            reason:
              type: [string, 'null']
              maxLength: 500
          additionalProperties: false
        deposit:
          $ref: '#/components/schemas/DepositInput'
      additionalProperties: false
    CustomerIndicators:
      description: Derived from current bookings and their events, never stored on the customer.
      type: object
      required: [noShowCount, lateCancellationCount, lateRescheduleCount, problematic]
      properties:
        noShowCount:
          type: integer
          minimum: 0
        lateCancellationCount:
          type: integer
          minimum: 0
        lateRescheduleCount:
          type: integer
          minimum: 0
        problematic:
          description: Two or more no-shows; an internal indicator that restricts nothing (BR-CLI-07).
          type: boolean
      additionalProperties: false
    CustomerSummary:
      type: object
      required: [id, fullName, phone, currentRestriction, problematic]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fullName:
          type: [string, 'null']
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        currentRestriction:
          oneOf:
            - $ref: '#/components/schemas/RestrictionKind'
            - type: 'null'
        problematic:
          type: boolean
      additionalProperties: false
    CustomerDetail:
      type: object
      required: [id, fullName, phone, reminderPreference, waitlistPreference, deletionStatus, deletionDueAt, currentRestriction, indicators, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fullName:
          type: [string, 'null']
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        reminderPreference:
          type: string
          enum: [UNSET, ACCEPTED, REFUSED]
        waitlistPreference:
          type: string
          enum: [UNSET, ACCEPTED, REFUSED]
        deletionStatus:
          type: string
          enum: [NONE, REQUESTED, EXECUTED]
        deletionDueAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        currentRestriction:
          oneOf:
            - $ref: '#/components/schemas/RestrictionKind'
            - type: 'null'
        indicators:
          $ref: '#/components/schemas/CustomerIndicators'
        createdAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    CustomerPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CustomerSummary'
    CreateCustomerRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
      additionalProperties: false
    UpdateCustomerRequest:
      description: A phone can only be added when the customer has none (API-Q-03).
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          $ref: '#/components/schemas/PhoneE164'
      additionalProperties: false
    Restriction:
      type: object
      required: [id, kind, reason, appliedByMembershipId, effectiveFrom, effectiveTo, removedByMembershipId, removalReason]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/RestrictionKind'
        reason:
          type: string
        appliedByMembershipId:
          $ref: '#/components/schemas/Uuid'
        effectiveFrom:
          $ref: '#/components/schemas/Instant'
        effectiveTo:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        removedByMembershipId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        removalReason:
          type: [string, 'null']
      additionalProperties: false
    RestrictionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restriction'
      additionalProperties: false
    ApplyRestrictionRequest:
      type: object
      required: [kind, reason]
      properties:
        kind:
          $ref: '#/components/schemas/RestrictionKind'
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
    RemoveRestrictionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
    Incident:
      type: object
      required: [id, bookingId, kind, description, recordedByMembershipId, occurredAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
        description:
          type: [string, 'null']
        recordedByMembershipId:
          $ref: '#/components/schemas/Uuid'
        occurredAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    IncidentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
      additionalProperties: false
    CreateIncidentRequest:
      type: object
      required: [bookingId, kind, occurredAt]
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        kind:
          description: Damage, conduct and similar. A no-show is recorded on the booking instead.
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: [string, 'null']
          maxLength: 2000
        occurredAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    PaymentMethod:
      type: string
      enum: [CASH, TRANSFER]
    PaymentReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ReviewArrival:
      description: |
        How evidence reached human review (API-DM-19). Routing only, never a verdict on the
        payment: CRM_SUBMISSION had no screening; SCREENING_INCONCLUSIVE covers an uncertain
        result and a technical failure alike (BR-SEN-15). The screening result values themselves
        belong to CON-03.
      type: string
      enum: [PLAUSIBLE_FILE, ESCALATED_AFTER_TWO_ATTEMPTS, SCREENING_INCONCLUSIVE, TEXT_FALLBACK, CRM_SUBMISSION]
    EvidenceUploadForm:
      type: object
      required: [file]
      properties:
        file:
          description: One PDF or image file.
          type: string
          contentMediaType: application/octet-stream
      additionalProperties: false
    EvidenceUpload:
      type: object
      required: [id, mediaType, sizeBytes, uploadedAt, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        uploadedAt:
          $ref: '#/components/schemas/Instant'
        expiresAt:
          description: Last instant for using the unlinked upload; physical retention is separate and subject to API-Q-12 and INV-DAT-03.
          allOf:
            - $ref: '#/components/schemas/Instant'
      additionalProperties: false
    EvidenceInput:
      description: An uploaded file, or transfer details typed by personnel.
      oneOf:
        - type: object
          required: [uploadId]
          properties:
            uploadId:
              $ref: '#/components/schemas/Uuid'
          additionalProperties: false
        - type: object
          required: [text]
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 2000
          additionalProperties: false
    SubmitPaymentEvidenceRequest:
      type: object
      required: [evidence]
      properties:
        evidence:
          $ref: '#/components/schemas/EvidenceInput'
        declaredAmount:
          description: Amount the customer says they transferred; never proof of credit.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
      additionalProperties: false
    AccountRef:
      type: object
      required: [id, label, holderName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        holderName:
          type: string
      additionalProperties: false
    ReviewBookingRef:
      type: object
      required: [id, status, startAt, customer, service]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/BookingStatus'
        startAt:
          $ref: '#/components/schemas/Instant'
        customer:
          type: object
          required: [id, fullName]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            fullName:
              type: [string, 'null']
          additionalProperties: false
        service:
          $ref: '#/components/schemas/NamedRef'
      additionalProperties: false
    PaymentReview:
      description: Human evaluation of evidence. Exposes no screening result and no attempt counter (P-40).
      type: object
      required: [id, status, purpose, arrivedVia, booking, changeRequestId, evidence, declaredAmount, expectedReceivingAccount, submittedAt, decision]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/PaymentReviewStatus'
        purpose:
          description: Derived by the server from the booking when the review is created.
          type: string
          enum: [INITIAL_DEPOSIT, SUPPLEMENTAL_DEPOSIT, BALANCE]
        arrivedVia:
          $ref: '#/components/schemas/ReviewArrival'
        booking:
          oneOf:
            - $ref: '#/components/schemas/ReviewBookingRef'
            - type: 'null'
        changeRequestId:
          description: The reschedule a supplemental review belongs to.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        evidence:
          type: object
          required: [kind, mediaType, text, receivedAt]
          properties:
            kind:
              type: string
              enum: [FILE, TEXT]
            mediaType:
              type: [string, 'null']
            text:
              type: [string, 'null']
            receivedAt:
              description: Trusted instant recorded for the evidence. For WhatsApp, timeliness uses the provider-assigned send time, with trusted ingress arrival only as fallback (BR-SEN-16).
              allOf:
                - $ref: '#/components/schemas/Instant'
          additionalProperties: false
        declaredAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        expectedReceivingAccount:
          description: The account in the instruction issued to the customer, if any.
          oneOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: 'null'
        submittedAt:
          description: When the review entered the human queue.
          allOf:
            - $ref: '#/components/schemas/Instant'
        decision:
          oneOf:
            - type: object
              required: [decidedByMembershipId, decidedAt, paymentId, rejectionReason]
              properties:
                decidedByMembershipId:
                  $ref: '#/components/schemas/Uuid'
                decidedAt:
                  $ref: '#/components/schemas/Instant'
                paymentId:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                rejectionReason:
                  type: [string, 'null']
              additionalProperties: false
            - type: 'null'
      additionalProperties: false
    PaymentReviewPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PaymentReview'
    AllocationItem:
      type: object
      required: [chargeId, amount]
      properties:
        chargeId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
      additionalProperties: false
    ApprovePaymentReviewRequest:
      description: |
        For a review of an active booking the approval carries the allocation in the same human
        action, up to the amount the booking's charges still owe (BR-SEN-07, BR-COB-03–04,
        INV-SEN-14); the backend refuses an approval that leaves payable debt unallocated with
        `422 allocation_required`. An empty `allocations` is accepted only with an
        `unallocatedReason`, for money that exceeds the amount owed, is not matched to the booking,
        or belongs to a booking already released (BR-COB-02, BR-COB-17).
      type: object
      required: [verifiedAmount, allocations]
      if:
        properties:
          allocations:
            type: array
            maxItems: 0
      then:
        required: [unallocatedReason]
        properties:
          unallocatedReason:
            type: string
            minLength: 1
      properties:
        verifiedAmount:
          description: The amount actually credited, as checked by the person; not the declared amount.
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        receivingAccountId:
          description: The account that actually received the funds; null keeps the expected one, required when the review has none.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        allocations:
          description: Explicit allocations of the new payment, chosen by the person in this same action; an empty array leaves the whole payment unallocated and then needs `unallocatedReason`.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AllocationItem'
        unallocatedReason:
          description: Why part of the verified amount stays unallocated (excess over the amount owed, money not matched to the booking, released booking; BR-COB-02, BR-COB-17). Required when `allocations` is empty or does not use the whole `verifiedAmount`.
          type: [string, 'null']
          maxLength: 500
      additionalProperties: false
    RejectPaymentReviewRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
    PaymentReviewDecisionResult:
      type: object
      required: [review, payment, booking, bookingEffect]
      properties:
        review:
          $ref: '#/components/schemas/PaymentReview'
        payment:
          description: The payment created by an approval; null on rejection.
          oneOf:
            - $ref: '#/components/schemas/Payment'
            - type: 'null'
        booking:
          oneOf:
            - $ref: '#/components/schemas/BookingSummary'
            - type: 'null'
        bookingEffect:
          description: What the decision did to the booking in the same transaction.
          type: string
          enum: [NONE, CONFIRMED, CORRECTION_WINDOW_OPENED, CANCELLED]
      additionalProperties: false
    PaymentAllocation:
      type: object
      required: [id, paymentId, chargeId, bookingId, amount, status, createdByMembershipId, createdAt, reversedByMembershipId, reversedAt, reversalReason]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        paymentId:
          $ref: '#/components/schemas/Uuid'
        chargeId:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        status:
          type: string
          enum: [ACTIVE, REVERSED]
        createdByMembershipId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Instant'
        reversedByMembershipId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reversedAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        reversalReason:
          type: [string, 'null']
      additionalProperties: false
    Payment:
      description: Verified commercial money; immutable once recorded (BR-COB-11).
      type: object
      required: [id, method, amount, commercialOrigin, bookingId, customerId, receivingAccountId, paymentReviewId, verifiedByMembershipId, verifiedAt, allocatedAmount, refundedAmount, availableAmount, unallocatedReason, cashMovementId, possibleDuplicateOf, allocations]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        commercialOrigin:
          type: string
        bookingId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        customerId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        receivingAccountId:
          description: Set for TRANSFER, null for CASH.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        paymentReviewId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        verifiedByMembershipId:
          $ref: '#/components/schemas/Uuid'
        verifiedAt:
          $ref: '#/components/schemas/Instant'
        allocatedAmount:
          description: Sum of active allocations.
          allOf:
            - $ref: '#/components/schemas/Money'
        refundedAmount:
          description: Executed refunds only; refunds are specified in a later increment.
          allOf:
            - $ref: '#/components/schemas/Money'
        availableAmount:
          description: amount − refundedAmount − allocatedAmount; never negative (INV-PAY-07).
          allOf:
            - $ref: '#/components/schemas/Money'
        unallocatedReason:
          type: [string, 'null']
        cashMovementId:
          description: The physical movement of a CASH payment; the same money, never counted twice.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        possibleDuplicateOf:
          description: Other separate entries that may be the same money; both are kept and flagged for human review, never blocked (INV-PAY-08, proposal).
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocation'
      additionalProperties: false
    PaymentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
    RecordPaymentRequest:
      description: |
        TRANSFER requires `receivingAccountId`; CASH must not send one. A payment, TRANSFER or CASH,
        recorded for an active booking carries its allocation in the same action, up to the amount owed
        (BR-SEN-07, BR-COB-03, INV-SEN-14): the backend refuses payable debt left unallocated with
        `422 allocation_required`, and `allocations` may stay empty only with an
        `unallocatedReason` for excess, unmatched money or a released booking (BR-COB-17). CASH
        needs an open session; the tenant's very first session can only be opened manually with an
        explicit `openingAmount`, so a CASH payment with no open session and no earlier close is
        `409 cash_session_not_open` even when automatic opening is configured (BR-CAJA-03, API-DM-22).
      type: object
      required: [method, amount, commercialOrigin]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        commercialOrigin:
          description: The known commercial operation the money belongs to (BR-COB-02).
          type: string
          minLength: 1
          maxLength: 500
        bookingId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        customerId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        receivingAccountId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        allocations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AllocationItem'
        unallocatedReason:
          type: [string, 'null']
          maxLength: 500
      additionalProperties: false
    CashSessionRef:
      type: object
      required: [id, openMode, openedByThisPayment]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        openMode:
          type: string
          enum: [MANUAL, AUTOMATIC]
        openedByThisPayment:
          description: True when the tenant's automatic opening opened the session for this payment.
          type: boolean
      additionalProperties: false
    PaymentResult:
      type: object
      required: [payment, cashSession, affectedBookings]
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        cashSession:
          description: The session of a CASH payment; null for TRANSFER.
          oneOf:
            - $ref: '#/components/schemas/CashSessionRef'
            - type: 'null'
        affectedBookings:
          description: Bookings whose charges received allocations, after any confirmation.
          type: array
          items:
            $ref: '#/components/schemas/BookingSummary'
      additionalProperties: false
    AllocatePaymentRequest:
      type: object
      required: [allocations]
      properties:
        allocations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/AllocationItem'
      additionalProperties: false
    ReverseAllocationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
    AllocationResult:
      description: Result of `allocatePayment` and `reversePaymentAllocation`, multi-owner commands whose coordinator assembles the affected bookings from its participants (API-DM-25).
      type: object
      required: [payment, affectedBookings]
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        affectedBookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingSummary'
      additionalProperties: false
    ReceivingAccount:
      type: object
      required: [id, label, beneficiaryKind, holderName, aliasOrNumber, isDefault, isActive]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        beneficiaryKind:
          type: string
          enum: [BUSINESS, PROFESSIONAL]
        holderName:
          type: string
        aliasOrNumber:
          type: string
        isDefault:
          type: boolean
        isActive:
          type: boolean
      additionalProperties: false
    ReceivingAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingAccount'
      additionalProperties: false
    ChargeView:
      type: object
      required: [id, kind, changeRequestId, netAmount, allocatedAmount, balance]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [SERVICE, SUPPLEMENT]
        changeRequestId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        netAmount:
          $ref: '#/components/schemas/Money'
        allocatedAmount:
          $ref: '#/components/schemas/Money'
        balance:
          description: max(0, netAmount − allocatedAmount) (BR-COB-03).
          allOf:
            - $ref: '#/components/schemas/Money'
      additionalProperties: false
    InitialDeposit:
      description: |
        The deposit that governs confirmation (BR-SEN-07, BR-SEN-09–11). Its `required` is the
        historical initial threshold applied when the booking was created; it is not recomputed after
        a reschedule. The requirement of the conditions that apply now is `requiredDeposit` of the
        booking summary (API-DM-21).
      type: object
      required: [required, allocated, missing, state, exception, correctionDeadlineAt]
      properties:
        required:
          description: Initial threshold applied at creation; null when no deposit applied.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        allocated:
          description: Valid allocations counted toward the initial threshold; lower after a reversal of one of them, whatever the booking status (BR-SEN-18).
          $ref: '#/components/schemas/Money'
        missing:
          description: max(0, required − allocated) while the booking waits for its initial deposit.
          $ref: '#/components/schemas/Money'
        state:
          $ref: '#/components/schemas/DepositState'
        exception:
          description: Confirmed by an Admin without the deposit (BR-SEN-09).
          type: boolean
        correctionDeadlineAt:
          description: End of the 15-minute window after a first human rejection; never renewed (INV-SEN-13).
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
      additionalProperties: false
    SupplementalDeposit:
      description: |
        Additional deposit requested after a permitted reschedule (BR-CAN-10): the shortfall of the
        destination's current requirement over the valid allocations at that moment, so it exists only
        when something is missing and is never the whole requirement (API-DM-21). How it is stored is
        ERD T-03/T-05.
      type: object
      required: [changeRequestId, required, allocated, missing, state, requestedAt]
      properties:
        changeRequestId:
          $ref: '#/components/schemas/Uuid'
        required:
          description: Amount requested, fixed when the request is created; greater than zero.
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        allocated:
          description: Valid allocations made toward this request since it was created.
          $ref: '#/components/schemas/Money'
        missing:
          description: max(0, required − allocated). For NOT_COLLECTED it keeps the amount that was not collected.
          $ref: '#/components/schemas/Money'
        state:
          $ref: '#/components/schemas/SupplementalDepositState'
        requestedAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    CloseSupplementalDepositRequest:
      description: The request is identified by the booking's open supplemental deposit; only an optional reason is sent.
      type: object
      properties:
        reason:
          description: Optional explanation recorded with the decision (BR-CAN-15).
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'
      additionalProperties: false
    SupplementalDepositClosure:
      description: |
        The immutable record of a decision not to collect a supplemental deposit (BR-CAN-15,
        INV-CAN-10): who, when, the amount not collected and the optional reason. It is not a payment,
        a refund or a charge change.
      type: object
      required: [bookingId, changeRequestId, state, nonCollectedAmount, reason, recordedByMembershipId, recordedAt]
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        changeRequestId:
          $ref: '#/components/schemas/Uuid'
        state:
          const: NOT_COLLECTED
        nonCollectedAmount:
          description: The `missing` amount of the request when it was closed.
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        reason:
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'
        recordedByMembershipId:
          $ref: '#/components/schemas/Uuid'
        recordedAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    FinancialPaymentLine:
      type: object
      required: [paymentId, method, amount, allocatedHere, verifiedAt]
      properties:
        paymentId:
          $ref: '#/components/schemas/Uuid'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        allocatedHere:
          description: Active allocations of this payment to this booking's charges.
          allOf:
            - $ref: '#/components/schemas/Money'
        verifiedAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    BookingFinancialState:
      description: |
        What is owed and what verified money covers it, apart from the booking status and the
        service outcome (INV-RES-05) and from physical cash (API-DM-21). Never a cash balance.
        Five magnitudes stay separate: the current requirement (`requiredDeposit` of the booking
        summary), the historical initial requirement (`deposit.required`), verified funds
        (`payments`, `unallocatedLinkedFunds`), allocated funds (`deposit.allocated`, the charges
        and `payments[].allocatedHere`) and the requested supplement (`supplementalDeposit`).
      type: object
      required: [bookingId, bookingStatus, agreedPrice, charges, balanceDue, deposit, supplementalDeposit, payments, unallocatedLinkedFunds, pendingReviewIds]
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        bookingStatus:
          $ref: '#/components/schemas/BookingStatus'
        agreedPrice:
          $ref: '#/components/schemas/Money'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/ChargeView'
        balanceDue:
          description: Sum of the charge balances.
          allOf:
            - $ref: '#/components/schemas/Money'
        deposit:
          $ref: '#/components/schemas/InitialDeposit'
        supplementalDeposit:
          oneOf:
            - $ref: '#/components/schemas/SupplementalDeposit'
            - type: 'null'
        payments:
          description: Payments allocated to this booking or whose known origin is it.
          type: array
          items:
            $ref: '#/components/schemas/FinancialPaymentLine'
        unallocatedLinkedFunds:
          description: |
            Available funds of payments whose origin is this booking and that are not allocated
            anywhere: excess over the amount owed, or funds freed by a reversal. Verifying money
            for an active booking allocates it in the same action, so this is never a deposit state
            and it does not protect occupancy (BR-SEN-07, BR-COB-17).
          allOf:
            - $ref: '#/components/schemas/Money'
        pendingReviewIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    CashTotals:
      description: Expected cash counts physical movements only; verified transfers are shown apart and never added (BR-CAJA-07, INV-CAJA-04).
      type: object
      required: [cashPayments, cashRefunds, cashIn, cashOut, expectedCash, verifiedTransfers]
      properties:
        cashPayments:
          $ref: '#/components/schemas/Money'
        cashRefunds:
          $ref: '#/components/schemas/Money'
        cashIn:
          $ref: '#/components/schemas/Money'
        cashOut:
          $ref: '#/components/schemas/Money'
        expectedCash:
          description: Opening cash plus signed physical movements.
          allOf:
            - $ref: '#/components/schemas/SignedMoney'
        verifiedTransfers:
          description: Transfers verified while the session was open; informational, not cash.
          allOf:
            - $ref: '#/components/schemas/Money'
      additionalProperties: false
    CashAdjustment:
      type: object
      required: [id, sessionId, signedAmount, reason, adjustedByMembershipId, cashMovementId, paymentId, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        signedAmount:
          $ref: '#/components/schemas/NonZeroSignedMoney'
        reason:
          type: string
        adjustedByMembershipId:
          $ref: '#/components/schemas/Uuid'
        cashMovementId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        paymentId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    CashSession:
      type: object
      required: [id, status, openMode, openedAt, openedByMembershipId, openingAmount, previousSessionId, openingReconciliation, revision, totals, close, adjustments, adjustmentsTotal]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [OPEN, CLOSED]
        openMode:
          type: string
          enum: [MANUAL, AUTOMATIC]
        openedAt:
          description: A session survives midnight until its manual close (BR-CAJA-11).
          allOf:
            - $ref: '#/components/schemas/Instant'
        openedByMembershipId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        openingAmount:
          $ref: '#/components/schemas/Money'
        previousSessionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        openingReconciliation:
          description: Null for the first session of the tenant.
          oneOf:
            - type: object
              required: [previousCountedAmount, difference, reason]
              properties:
                previousCountedAmount:
                  $ref: '#/components/schemas/Money'
                difference:
                  $ref: '#/components/schemas/SignedMoney'
                reason:
                  type: [string, 'null']
              additionalProperties: false
            - type: 'null'
        revision:
          description: Increases with every movement, adjustment and the close; used as a precondition (API-DM-18). It implies no new column.
          type: integer
          minimum: 0
        totals:
          $ref: '#/components/schemas/CashTotals'
        close:
          oneOf:
            - type: object
              required: [closedAt, closedByMembershipId, countedAmount, expectedAmount, difference, note]
              properties:
                closedAt:
                  $ref: '#/components/schemas/Instant'
                closedByMembershipId:
                  $ref: '#/components/schemas/Uuid'
                countedAmount:
                  $ref: '#/components/schemas/Money'
                expectedAmount:
                  $ref: '#/components/schemas/SignedMoney'
                difference:
                  description: countedAmount − expectedAmount; allowed and recorded (BR-CAJA-06).
                  allOf:
                    - $ref: '#/components/schemas/SignedMoney'
                note:
                  type: [string, 'null']
              additionalProperties: false
            - type: 'null'
        adjustments:
          description: Admin adjustments appended after the close; they never change `close`.
          type: array
          items:
            $ref: '#/components/schemas/CashAdjustment'
        adjustmentsTotal:
          $ref: '#/components/schemas/SignedMoney'
      additionalProperties: false
    CashSessionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CashSession'
    CurrentCashSessionView:
      type: object
      required: [session, previousClose, automaticOpening]
      properties:
        session:
          description: The open session, or null.
          oneOf:
            - $ref: '#/components/schemas/CashSession'
            - type: 'null'
        previousClose:
          oneOf:
            - type: object
              required: [sessionId, closedAt, countedAmount]
              properties:
                sessionId:
                  $ref: '#/components/schemas/Uuid'
                closedAt:
                  $ref: '#/components/schemas/Instant'
                countedAmount:
                  $ref: '#/components/schemas/Money'
              additionalProperties: false
            - type: 'null'
        automaticOpening:
          description: |
            Whether the tenant configured automatic opening on a cash payment (BR-CAJA-03);
            configured in a later increment. It takes effect only after a counted close exists:
            with `session: null` and `previousClose: null` the first opening is manual, with an
            explicit `openingAmount` (API-DM-22). Afterwards the automatic opening takes the
            previous counted cash.
          type: boolean
      additionalProperties: false
    OpenCashSessionRequest:
      description: The tenant's first session needs an explicit, auditable `openingAmount`; no 0.00 is assumed (BR-CAJA-03).
      type: object
      required: [openingAmount]
      properties:
        openingAmount:
          $ref: '#/components/schemas/Money'
        reconciliationReason:
          description: Required when openingAmount differs from the previous counted cash (proposal, API-Q-15); not applicable to the first session, which has nothing to reconcile with.
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'
      additionalProperties: false
    CloseCashSessionRequest:
      type: object
      required: [expectedRevision, countedAmount]
      properties:
        expectedRevision:
          description: The `revision` of the session the person reviewed.
          type: integer
          minimum: 0
        countedAmount:
          $ref: '#/components/schemas/Money'
        note:
          type: [string, 'null']
          maxLength: 500
      additionalProperties: false
    CashMovement:
      type: object
      required: [id, sessionId, kind, signedAmount, paymentId, refundId, reason, recordedByMembershipId, occurredAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [PAYMENT, REFUND, CASH_IN, CASH_OUT]
        signedAmount:
          $ref: '#/components/schemas/NonZeroSignedMoney'
        paymentId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        refundId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reason:
          type: [string, 'null']
        recordedByMembershipId:
          $ref: '#/components/schemas/Uuid'
        occurredAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    CashMovementPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CashMovement'
    RecordCashMovementRequest:
      type: object
      required: [kind, amount, reason]
      properties:
        kind:
          type: string
          enum: [CASH_IN, CASH_OUT]
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        reason:
          $ref: '#/components/schemas/Reason'
      additionalProperties: false
    RecordCashAdjustmentRequest:
      type: object
      required: [expectedRevision, signedAmount, reason]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        signedAmount:
          $ref: '#/components/schemas/NonZeroSignedMoney'
        reason:
          $ref: '#/components/schemas/Reason'
        cashMovementId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        paymentId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
      additionalProperties: false

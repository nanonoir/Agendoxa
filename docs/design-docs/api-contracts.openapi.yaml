          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        rescheduleLimit:
          type: [integer, 'null']
          minimum: 0
        futureBookingLimit:
          type: [integer, 'null']
          minimum: 1
        sources:
          type: object

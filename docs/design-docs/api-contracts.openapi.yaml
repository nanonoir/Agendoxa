  /tenants/{tenantId}/bookings/{bookingId}/supplemental-deposit/non-collection:
    post:
      tags: [payments]
      operationId: closeSupplementalDepositWithoutCollection
      x-agendoxa-invokes:
        coordinator: workflows
        participants: [bookings, payments]
      summary: Close a supplemental deposit request without collecting it
      description: |
        Personnel with the payments permission decide not to collect the additional deposit requested
        after a permitted reschedule (BR-CAN-15, INV-CAN-10, including `FULL_PREPAYMENT` and `NOT_COLLECTED`; API-DM-26), under the
        `payments.allocate` permission. Only a request still `REQUESTED` can be closed. The decision is recorded once and immutably, with actor, time,
        the amount not collected and the optional reason, and `supplementalDepositState` becomes
        `NOT_COLLECTED`. It creates, alters, refunds or forgives no payment or charge and never
        changes the paid deposit, the agreed price or the `CONFIRMED` status; the balance stays
        price minus valid allocations, payable at the appointment. Conflicts: `409
        no_open_supplemental_deposit` when there is no request to close or it is already `MET` or
        `NOT_COLLECTED` (a second application with a new key); `409 state_changed` while its
        evidence is under review (the review is resolved first) or when the state changed concurrently; `409 idempotency_key_reused`
        and `idempotency_request_in_progress` as for every keyed POST.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSupplementalDepositRequest'
            examples:
              withReason:
                $ref: '#/components/examples/CloseSupplementalDepositRequest'
      responses:
        '200':
          description: Closed without collection; a retry with the same key returns this same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplementalDepositClosure'
              examples:
                closed:
                  $ref: '#/components/examples/SupplementalDepositClosure'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

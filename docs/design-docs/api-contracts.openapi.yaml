    DepositRule:
      description: |
        A deposit rule is exactly one of three shapes chosen by `mode`: DISABLED has `value: null`,
        FIXED a money amount greater than 0.00, PERCENTAGE a decimal from 0.01 to 100.00 inclusive.
        A configured deposit is always greater than zero; having none is expressed only by DISABLED
        (BR-SEN-02, BR-SEN-03). In an override, `null` for the whole field means inherit and is a
        different thing from DISABLED. The API enforces this; the persisted `deposit_value >= 0`
        check still allows zero (tech debt TD-03).
      oneOf:
        - $ref: '#/components/schemas/DepositRuleDisabled'
        - $ref: '#/components/schemas/DepositRuleFixed'
        - $ref: '#/components/schemas/DepositRulePercentage'
      discriminator:
        propertyName: mode
        mapping:
          DISABLED: '#/components/schemas/DepositRuleDisabled'
          FIXED: '#/components/schemas/DepositRuleFixed'
          PERCENTAGE: '#/components/schemas/DepositRulePercentage'
    DepositRuleDisabled:
      type: object
      required: [mode, value]
      properties:
        mode:
          const: DISABLED
        value:
          description: 'Always null: a disabled deposit has no amount.'
          type: 'null'
      additionalProperties: false
    DepositRuleFixed:
      type: object
      required: [mode, value]
      properties:
        mode:
          const: FIXED
        value:
          $ref: '#/components/schemas/PositiveMoney'
      additionalProperties: false
    DepositRulePercentage:
      type: object
      required: [mode, value]
      properties:
        mode:
          const: PERCENTAGE
        value:
          $ref: '#/components/schemas/Percentage'
      additionalProperties: false
    OverridePolicyFields:
      description: Service or resource override. Null means inherit (DM-06).
      type: object
      required: [noticeMinutes, reminderLeadMinutes, deposit, depositRefundPolicy, rescheduleLimit]
      properties:
        noticeMinutes:
          type: [integer, 'null']
          minimum: 0
        reminderLeadMinutes:
          type: [integer, 'null']
          minimum: 0
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositRule'
            - type: 'null'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        rescheduleLimit:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    TenantPolicyFields:
      description: Tenant base policy. Null keeps the product default stated in the document (§7.3).
      type: object
      required: [noticeMinutes, bookingLeadMinutes, reminderLeadMinutes, deposit, depositRefundPolicy, rescheduleLimit, futureBookingLimit]
      properties:
        noticeMinutes:
          type: [integer, 'null']
          minimum: 0
        bookingLeadMinutes:
          type: [integer, 'null']
          minimum: 0
        reminderLeadMinutes:
          type: [integer, 'null']
          minimum: 0
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositRule'
            - type: 'null'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        rescheduleLimit:
          description: Null means unlimited.
          type: [integer, 'null']
          minimum: 0
        futureBookingLimit:
          description: Null means disabled.
          type: [integer, 'null']
          minimum: 1
      additionalProperties: false
    BookingPolicy:
      type: object
      required: [id, scope, serviceId, resourceId, fields]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scope:
          type: string
          enum: [TENANT, SERVICE, RESOURCE]
        serviceId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'

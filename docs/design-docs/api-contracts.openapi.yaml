openapi: 3.1.0
info:
  title: Agendoxa API — initial MVP contracts (CON-02)
  version: 0.4.0-proposal
  summary: Proposal for team review; no endpoint is implemented.
  description: |
    Design contract for the authenticated CRM and the read-only public landing.
    It accompanies [api-contracts.md](./api-contracts.md), which explains every
    convention and decision (`API-DM-XX`). Operations are grouped by owner module
    from [modules.md](./modules.md) through tags (API-DM-12).

    `x-agendoxa-invokes` marks how an operation reaches the owners: `coordinator: workflows`
    with its `participants` for a multi-owner command, `composition` with the owners a
    cross-owner read combines, or `responseComposition` when the command itself is an owner
    command but its response carries another owner's facts and is therefore read after the
    commit, above the owners (API-DM-25). Without it, the operation is one use case of the
    tagged owner. The extension documents ownership only; it does not change the HTTP contract.

    WhatsApp self-service and agent tools are not HTTP and are not described here; their typed
    contracts belong to CON-03 (API-DM-23). Receipt upload, human review, verified payments,
    explicit allocation, booking financial state and the cash session are specified (`payments`
    tag). Payment corrections, refunds, collection settings, conversations, roles, channel
    connection and audit operations are identified in the document for a later increment.

    Reconciled 2026-11-10 with the consolidated CON-01 module catalog: calendars, hours,
    blocks and openings are tagged `catalog`; the former `availability` tag is removed.
    Version 0.3.0 adds the priority money flows (API-DM-18 to API-DM-22).

    Version 0.4.0 applies the PR #33 review and the product-owner agreements of 2026-11-12 as
    proposals for team review, not ratified: current deposit requirement kept apart from the
    initial one and the supplement (API-DM-21); verification allocates in the same action, so
    `AWAITING_ALLOCATION` is removed; a supplemental deposit request can be closed without
    collecting it (API-DM-26); the first cash session is opened manually (API-DM-22);
    responses no longer carry another owner's facts unless composed above the owners
    (API-DM-25); stricter `DepositInput`, `DepositRule` and `RescheduleResult`; a `403` on
    permission-gated reads and `409` idempotency conflicts on every keyed `POST`; a public
    address and Maps link for the landing, pending adoption in the ERD.
servers:
  - url: /api/v1
    description: Relative to the API origin of each installation.
tags:
  - name: public
    description: Read-only landing information (owners tenants and catalog; the WhatsApp link comes from messaging). No booking.
  - name: identity
    description: Session and tenant context.
  - name: tenants
    description: Business profile.
  - name: catalog
    description: Services, resources, compatibility, booking policies, calendars, weekly hours, blocks, openings and open windows.
  - name: bookings
    description: Free slots, agenda and booking lifecycle commands. Multi-owner commands go through workflows.
  - name: customers
    description: Customers, restrictions and incidents.
  - name: payments
    description: Receipt evidence and human review, verified payments, explicit allocations, booking financial state and the shared cash session. No gateway or bank API.
security:
  - sessionCookie: []
paths:
  /public/businesses/{slug}:
    get:
      tags: [public]
      operationId: getPublicBusiness
      x-agendoxa-invokes:
        composition: [tenants, catalog, messaging]
      summary: Public business profile for the landing
      description: |
        The slug selects the business for display only; it never authorizes anything. Location is
        the public address text with an optional Maps link (proposed, pending ERD adoption); the
        WhatsApp link is built from the tenant's connected number.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Public profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBusinessProfile'
              examples:
                barbershop:
                  $ref: '#/components/examples/PublicBusinessProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/businesses/{slug}/services:
    get:
      tags: [public]
      operationId: listPublicServices
      summary: Active services for the landing
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Active services, ordered by name.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServiceList'
        '404':
          $ref: '#/components/responses/NotFound'
  /session:
    post:
      tags: [identity]
      operationId: signIn
      summary: Sign in to the CRM
      description: Sets the session cookie. Invalid credentials never reveal whether the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Session established.
          headers:
            Set-Cookie:
              description: '`agendoxa_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/api`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
              examples:
                twoBusinesses:
                  $ref: '#/components/examples/SessionView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [identity]
      operationId: getSession
      summary: Current user and active memberships
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [identity]
      operationId: signOut
      summary: End the session
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Session ended and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tenants/{tenantId}/me:
    get:
      tags: [identity]
      operationId: getTenantContext
      summary: Membership, role and effective permissions in one business
      description: For the UI to show allowed actions; the backend still checks every request.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Validated tenant context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContextView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}:
    get:
      tags: [tenants]
      operationId: getTenantProfile
      summary: Business profile
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tenants]
      operationId: updateTenantProfile
      summary: Update name or branding
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantProfileRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/services:
    get:
      tags: [catalog]
      operationId: listServices
      summary: List services
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Services ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [catalog]
      operationId: createService
      summary: Create a service
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenants/{tenantId}/services/{serviceId}:
    get:
      tags: [catalog]
      operationId: getService
      summary: Get a service
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [catalog]
      operationId: updateService
      summary: Update or deactivate a service
      description: A new price applies to new bookings only; agreed bookings keep their snapshot (BR-COB-13).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/services/{serviceId}/resources:
    get:
      tags: [catalog]
      operationId: listServiceResources
      summary: Resources compatible with a service
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Compatible resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/services/{serviceId}/resources/{resourceId}:
    put:
      tags: [catalog]
      operationId: linkServiceResource
      summary: Mark a resource as compatible with a service
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Linked; repeating the call changes nothing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [catalog]
      operationId: unlinkServiceResource
      summary: Remove a compatibility link
      description: Existing bookings are not changed; new bookings can no longer combine them (API-Q-04).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Unlinked; repeating the call changes nothing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/resources:
    get:
      tags: [catalog]
      operationId: listResources
      summary: List resources
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Resources ordered by preference order, then name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [catalog]
      operationId: createResource
      summary: Create a professional or physical resource
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenants/{tenantId}/resources/{resourceId}:
    get:
      tags: [catalog]
      operationId: getResource
      summary: Get a resource
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [catalog]
      operationId: updateResource
      summary: Update or deactivate a resource
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/booking-policies:
    get:
      tags: [catalog]
      operationId: listBookingPolicies
      summary: Tenant policy and every service or resource override
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Stored policies; empty fields inherit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/booking-policies/tenant:
    put:
      tags: [catalog]
      operationId: putTenantBookingPolicy
      summary: Replace the tenant base policy
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPolicyFields'
      responses:
        '200':
          description: Stored policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicy'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/booking-policies/services/{serviceId}:
    put:
      tags: [catalog]
      operationId: putServiceBookingPolicy
      summary: Replace a service override
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverridePolicyFields'
      responses:
        '200':
          description: Stored override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicy'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [catalog]
      operationId: deleteServiceBookingPolicy
      summary: Remove a service override so every field inherits again
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '204':
          description: Removed; bookings keep their snapshots.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/booking-policies/resources/{resourceId}:
    put:
      tags: [catalog]
      operationId: putResourceBookingPolicy
      summary: Replace a resource override
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverridePolicyFields'
      responses:
        '200':
          description: Stored override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicy'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [catalog]
      operationId: deleteResourceBookingPolicy
      summary: Remove a resource override so every field inherits again
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Removed; bookings keep their snapshots.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/booking-policies/effective:
    get:
      tags: [catalog]
      operationId: getEffectiveBookingPolicy
      summary: Resolved policy for a service and resource
      description: Resolves each field by resource > service > tenant, with the source of every value (DM-06).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: serviceId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: resourceId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Effective policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveBookingPolicy'
              examples:
                courtWithoutDeposit:
                  $ref: '#/components/examples/EffectiveBookingPolicy'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/calendars:
    get:
      tags: [catalog]
      operationId: listCalendars
      summary: Tenant calendar and resource-specific calendars
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Calendars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/resources/{resourceId}/calendar:
    put:
      tags: [catalog]
      operationId: ensureResourceCalendar
      summary: Give a resource its own calendar instead of inheriting the tenant hours
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource already had a calendar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '201':
          description: Calendar created, with no rules yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [catalog]
      operationId: deleteResourceCalendar
      summary: Make a resource inherit the tenant hours again
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Removed with its weekly rules.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenants/{tenantId}/calendars/{calendarId}/rules:
    get:
      tags: [catalog]
      operationId: getCalendarRules
      summary: Weekly hours of a calendar
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalendarId'
      responses:
        '200':
          description: Weekly rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyRules'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [catalog]
      operationId: replaceCalendarRules
      summary: Replace all weekly hours of a calendar in one change
      description: Confirmed bookings are preserved even if they fall outside the new hours (BR-DISP-08).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalendarId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyRules'
      responses:
        '200':
          description: Stored rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyRules'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':

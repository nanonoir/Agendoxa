      summary: Explicitly allocate verified funds of one payment to one or more charges
      description: |
        All items apply together or none does. Each is capped by the charge balance and the
        payment's available funds, checked against current state (INV-PAY-07, API-DM-18). An
        allocation that reaches the initial-deposit threshold confirms the booking once.

      additionalProperties: false
    BookingPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingPolicy'
      additionalProperties: false
    PolicySource:
      type: string
      enum: [RESOURCE, SERVICE, TENANT, DEFAULT]
    EffectiveBookingPolicy:
      type: object
      required: [serviceId, resourceId, noticeMinutes, bookingLeadMinutes, reminderLeadMinutes, deposit, depositRefundPolicy, rescheduleLimit, futureBookingLimit, sources]
      properties:
        serviceId:
          $ref: '#/components/schemas/Uuid'
        resourceId:
          $ref: '#/components/schemas/Uuid'
        noticeMinutes:
          $ref: '#/components/schemas/Minutes'
        bookingLeadMinutes:

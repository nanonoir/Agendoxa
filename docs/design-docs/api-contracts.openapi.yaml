            depositRefundPolicy:
              $ref: '#/components/schemas/PolicySource'
            rescheduleLimit:
              $ref: '#/components/schemas/PolicySource'
            futureBookingLimit:
              $ref: '#/components/schemas/PolicySource'
          additionalProperties: false
      additionalProperties: false
    Calendar:

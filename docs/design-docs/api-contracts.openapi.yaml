components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: agendoxa_session
      description: Opaque server-side session set by `POST /session` (API-DM-06).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token from the session response; required on every non-safe method.
  headers:
    PublicCacheControl:
      description: Public data may be cached briefly.
      schema:
        type: string
        example: public, max-age=300
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Selects the business; access requires an active membership, revalidated on every request.
      schema:
        $ref: '#/components/schemas/Uuid'
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        maxLength: 63
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CalendarId:
      name: calendarId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated, unique per intended operation; a retry reuses it (API-DM-10).
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    IncludeInactive:
      name: includeInactive
      in: query
      required: false
      schema:
        type: boolean
        default: false
    FromDate:
      name: from
      in: query
      required: true
      description: First local date, inclusive, in the tenant timezone.
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToDate:
      name: to
      in: query
      required: true
      description: Last local date, inclusive. Agenda and free slots accept at most 14 days; windows at most 31.
      schema:
        $ref: '#/components/schemas/LocalDate'
    FromInstant:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Instant'
    ToInstant:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Instant'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque value from `nextCursor`; valid only with the same filters.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    ValidationError:
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidPhone:
              $ref: '#/components/examples/ProblemValidation'
    Unauthorized:
      description: No valid session, or invalid credentials on sign-in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Valid membership, but the role lacks the permission, or the operation is Admin-only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            adminOnly:
              $ref: '#/components/examples/ProblemForbidden'
    NotFound:
      description: Not found, including records of another tenant and tenants without an active membership.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            otherTenant:
              $ref: '#/components/examples/ProblemNotFound'
    Conflict:
      description: Current state prevents the operation, such as an occupied slot or a reused idempotency key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            slotTaken:
              $ref: '#/components/examples/ProblemSlotUnavailable'
    RuleViolation:
      description: The request is valid, but a business rule rejects it now.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lateCancellation:
              $ref: '#/components/examples/ProblemLateChange'
  schemas:
    Uuid:
      type: string
      format: uuid
    Instant:
      description: UTC instant, RFC 3339 with a `Z` suffix.
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
    LocalDate:
      description: Calendar date in the tenant timezone.
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    LocalTime:
      description: Wall-clock time in the tenant timezone, 24-hour `HH:mm`.
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    Money:
      description: Exact non-negative decimal with two places in the tenant currency.
      type: string
      pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
    Minutes:
      type: integer
      minimum: 0
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{1,14}$'
    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    Reason:
      type: string
      minLength: 1
      maxLength: 500
    BookingStatus:
      description: The seven statuses of `booking_status`; only the bookings module changes them.
      type: string
      enum: [HOLD, PENDING_PAYMENT_REVIEW, CONFIRMED, CANCELLED, EXPIRED, COMPLETED, NO_SHOW]
    DepositState:
      description: |
        Derived from the booking and payment facts; never a booking status (API-DM-13).
        AWAITING_EVIDENCE also covers a first clearly unrelated file and evidence still under
        preliminary screening. UNDER_REVIEW means human review, whatever routed the evidence
        there; CORRECTION_WINDOW follows a human rejection only. No value is a screening verdict
        (BR-SEN-14–16).
      type: string
      enum: [NOT_REQUIRED, AWAITING_EVIDENCE, UNDER_REVIEW, CORRECTION_WINDOW, PARTIAL, MET, ADMIN_EXCEPTION]
    RestrictionKind:
      type: string
      enum: [FULL_PREPAYMENT, BLOCKED]
    Problem:
      description: RFC 9457 problem details (API-DM-09).
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum: [validation, unauthorized, forbidden, not_found, conflict, rule_violation, external_dependency, internal]
        reason:
          description: Stable snake_case reason within the code, listed per endpoint in the document.
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
        lateChange:
          $ref: '#/components/schemas/LateChangeNotice'
      additionalProperties: false
    LateChangeNotice:
      description: Returned with reason `late_change_requires_acceptance` so the CRM can show the consequence.
      type: object
      required: [noticeMinutes, startAt, depositRefundPolicy]
      properties:
        noticeMinutes:
          $ref: '#/components/schemas/Minutes'
        startAt:
          $ref: '#/components/schemas/Instant'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
      additionalProperties: false
    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
      additionalProperties: false
    MembershipSummary:
      type: object
      required: [membershipId, tenantId, tenantName, tenantSlug, roleName]
      properties:
        membershipId:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        tenantName:
          type: string
        tenantSlug:
          type: string
        roleName:
          type: string
      additionalProperties: false
    SessionView:
      type: object
      required: [user, memberships, csrfToken]
      properties:
        user:
          type: object
          required: [id, email, fullName]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            email:
              type: string
              format: email
            fullName:
              type: string
          additionalProperties: false
        memberships:
          description: Active memberships only; nothing about other installations.
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
        csrfToken:
          type: string
      additionalProperties: false
    TenantContextView:
      type: object
      required: [tenantId, membershipId, role, permissions]
      properties:
        tenantId:
          $ref: '#/components/schemas/Uuid'
        membershipId:
          $ref: '#/components/schemas/Uuid'
        role:
          type: object
          required: [id, name, systemKey]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            systemKey:
              type: [string, 'null']
              enum: [ADMIN, STAFF, null]
          additionalProperties: false
        permissions:
          description: Effective permission keys; the catalog is defined with identity (API-Q-02).
          type: array
          items:
            type: string
      additionalProperties: false
    TenantProfile:
      type: object
      required: [id, name, slug, timezone, currency, branding]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        slug:
          type: string
        timezone:
          description: IANA timezone name.
          type: string
        currency:
          description: ISO 4217 code; one currency per tenant.
          type: string
          pattern: '^[A-Z]{3}$'
        branding:
          type: [string, 'null']
      additionalProperties: false
    UpdateTenantProfileRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        branding:
          type: [string, 'null']
          maxLength: 2000
      additionalProperties: false
    WeeklyHours:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
      additionalProperties: false
    PublicBusinessProfile:
      type: object
      required: [name, slug, timezone, branding, whatsappUrl, regularHours]
      properties:
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        branding:
          type: [string, 'null']
        whatsappUrl:
          description: wa.me link to the active WhatsApp connection; null when none is active.
          type: [string, 'null']
          format: uri
        regularHours:
          description: Tenant calendar weekly hours. No availability or occupancy.
          type: array
          items:
            $ref: '#/components/schemas/WeeklyHours'
      additionalProperties: false
    PublicService:
      type: object
      required: [id, name, description, durationMinutes, price]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        description:
          type: [string, 'null']
        durationMinutes:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    PublicServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicService'
      additionalProperties: false
    Service:
      type: object
      required: [id, name, description, durationMinutes, price, isActive]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        description:
          type: [string, 'null']
        durationMinutes:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
        isActive:
          type: boolean
      additionalProperties: false
    ServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
      additionalProperties: false
    CreateServiceRequest:
      type: object
      required: [name, durationMinutes, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        price:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    UpdateServiceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        price:
          $ref: '#/components/schemas/Money'
        isActive:
          type: boolean
      additionalProperties: false
    Resource:
      type: object
      required: [id, name, kind, isActive, preferenceOrder]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        kind:
          type: string
          enum: [PROFESSIONAL, PHYSICAL]
        isActive:
          type: boolean
        preferenceOrder:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    ResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
      additionalProperties: false
    CreateResourceRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [PROFESSIONAL, PHYSICAL]
        preferenceOrder:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    UpdateResourceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        isActive:
          type: boolean
        preferenceOrder:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    DepositRule:
      description: FIXED uses an amount; PERCENTAGE uses 0–100 with two decimals; DISABLED explicitly disables.
      type: object
      required: [mode, value]
      properties:
        mode:
          type: string
          enum: [DISABLED, FIXED, PERCENTAGE]
        value:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
      additionalProperties: false
    OverridePolicyFields:
      description: Service or resource override. Null means inherit (DM-06).
      type: object
      required: [noticeMinutes, reminderLeadMinutes, deposit, depositRefundPolicy, rescheduleLimit]
      properties:
        noticeMinutes:
          type: [integer, 'null']
          minimum: 0
        reminderLeadMinutes:
          type: [integer, 'null']
          minimum: 0
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositRule'
            - type: 'null'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        rescheduleLimit:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    TenantPolicyFields:
      description: Tenant base policy. Null keeps the product default stated in the document (§7.3).
      type: object
      required: [noticeMinutes, bookingLeadMinutes, reminderLeadMinutes, deposit, depositRefundPolicy, rescheduleLimit, futureBookingLimit]
      properties:
        noticeMinutes:
          type: [integer, 'null']
          minimum: 0
        bookingLeadMinutes:
          type: [integer, 'null']
          minimum: 0
        reminderLeadMinutes:
          type: [integer, 'null']
          minimum: 0
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositRule'
            - type: 'null'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        rescheduleLimit:
          description: Null means unlimited.
          type: [integer, 'null']
          minimum: 0
        futureBookingLimit:
          description: Null means disabled.
          type: [integer, 'null']
          minimum: 1
      additionalProperties: false
    BookingPolicy:
      type: object
      required: [id, scope, serviceId, resourceId, fields]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scope:
          type: string
          enum: [TENANT, SERVICE, RESOURCE]
        serviceId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        resourceId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        fields:
          oneOf:
            - $ref: '#/components/schemas/TenantPolicyFields'
            - $ref: '#/components/schemas/OverridePolicyFields'
      additionalProperties: false
    BookingPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingPolicy'
      additionalProperties: false
    PolicySource:
      type: string
      enum: [RESOURCE, SERVICE, TENANT, DEFAULT]
    EffectiveBookingPolicy:
      type: object
      required: [serviceId, resourceId, noticeMinutes, bookingLeadMinutes, reminderLeadMinutes, deposit, depositRefundPolicy, rescheduleLimit, futureBookingLimit, sources]
      properties:
        serviceId:
          $ref: '#/components/schemas/Uuid'
        resourceId:
          $ref: '#/components/schemas/Uuid'
        noticeMinutes:
          $ref: '#/components/schemas/Minutes'
        bookingLeadMinutes:
          $ref: '#/components/schemas/Minutes'
        reminderLeadMinutes:
          type: [integer, 'null']
          minimum: 0
        deposit:
          $ref: '#/components/schemas/DepositRule'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        rescheduleLimit:
          type: [integer, 'null']
          minimum: 0
        futureBookingLimit:
          type: [integer, 'null']
          minimum: 1
        sources:
          type: object
          required: [noticeMinutes, bookingLeadMinutes, reminderLeadMinutes, deposit, depositRefundPolicy, rescheduleLimit, futureBookingLimit]
          properties:
            noticeMinutes:
              $ref: '#/components/schemas/PolicySource'
            bookingLeadMinutes:
              $ref: '#/components/schemas/PolicySource'
            reminderLeadMinutes:
              $ref: '#/components/schemas/PolicySource'
            deposit:
              $ref: '#/components/schemas/PolicySource'
            depositRefundPolicy:
              $ref: '#/components/schemas/PolicySource'
            rescheduleLimit:
              $ref: '#/components/schemas/PolicySource'
            futureBookingLimit:
              $ref: '#/components/schemas/PolicySource'
          additionalProperties: false
      additionalProperties: false
    Calendar:
      type: object
      required: [id, scope, resourceId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scope:
          type: string
          enum: [TENANT, RESOURCE]
        resourceId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
      additionalProperties: false
    CalendarList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
      additionalProperties: false
    WeeklyRules:
      type: object
      required: [rules]
      properties:
        rules:
          description: startTime before endTime; ranges of the same weekday must not overlap.
          type: array
          maxItems: 70
          items:
            $ref: '#/components/schemas/WeeklyHours'
      additionalProperties: false
    AvailabilityException:
      type: object
      required: [id, calendarId, kind, startAt, endAt, reason, createdByMembershipId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        calendarId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [BLOCK, OPENING]
        startAt:
          $ref: '#/components/schemas/Instant'
        endAt:
          $ref: '#/components/schemas/Instant'
        reason:
          type: [string, 'null']
        createdByMembershipId:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    AvailabilityExceptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityException'
      additionalProperties: false
    CreateAvailabilityExceptionRequest:
      type: object
      required: [calendarId, kind, startAt, endAt]
      properties:
        calendarId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [BLOCK, OPENING]
        startAt:
          $ref: '#/components/schemas/Instant'
        endAt:
          $ref: '#/components/schemas/Instant'
        reason:
          type: [string, 'null']
          maxLength: 500
      additionalProperties: false
    TimeRange:
      description: Half-open interval `[startAt, endAt)`.
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          $ref: '#/components/schemas/Instant'
        endAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    ResourceWindows:
      type: object
      required: [resourceId, windows]
      properties:
        resourceId:
          $ref: '#/components/schemas/Uuid'
        windows:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
      additionalProperties: false
    FreeSlot:
      type: object
      required: [resourceId, startAt, endAt]
      properties:
        resourceId:
          $ref: '#/components/schemas/Uuid'
        startAt:
          $ref: '#/components/schemas/Instant'
        endAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    FreeSlotList:
      type: object
      required: [serviceId, items]
      properties:
        serviceId:
          $ref: '#/components/schemas/Uuid'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FreeSlot'
      additionalProperties: false
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
      additionalProperties: false
    BookingSummary:
      type: object
      required: [id, status, origin, customer, attendeeName, service, resource, startAt, endAt, agreedPrice, requiredDeposit, depositState, pendingOperationalClose, holdExpiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/BookingStatus'
        origin:
          type: string
          enum: [WHATSAPP, CRM]
        customer:
          type: object
          required: [id, fullName]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            fullName:
              type: [string, 'null']
          additionalProperties: false
        attendeeName:
          type: [string, 'null']
        service:
          $ref: '#/components/schemas/NamedRef'
        resource:
          $ref: '#/components/schemas/NamedRef'
        startAt:
          description: From the active claim, or the last one for a released booking.
          allOf:
            - $ref: '#/components/schemas/Instant'
        endAt:
          $ref: '#/components/schemas/Instant'
        agreedPrice:
          $ref: '#/components/schemas/Money'
        requiredDeposit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        depositState:
          $ref: '#/components/schemas/DepositState'
        pendingOperationalClose:
          description: CONFIRMED and already ended; derived, not a status (BR-RES-13).
          type: boolean
        holdExpiresAt:
          description: Never extended by a replacement or rescreening; may be past while timely evidence is still screened (BR-SEN-16).
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
      additionalProperties: false
    BookingDetail:
      type: object
      required: [booking, attendeePhone, noticeMinutes, depositRefundPolicy, blockedException, depositException, createdByMembershipId, cancelReason, createdAt, updatedAt]
      properties:
        booking:
          $ref: '#/components/schemas/BookingSummary'
        attendeePhone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        noticeMinutes:
          description: Notice snapshot applied to this booking.
          allOf:
            - $ref: '#/components/schemas/Minutes'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
        blockedException:
          type: boolean
        depositException:
          type: boolean
        createdByMembershipId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        cancelReason:
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    BookingPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BookingSummary'
    BookingEvent:
      type: object
      required: [id, eventType, fromStatus, toStatus, actorKind, actorMembershipId, reason, lateChangeKind, occurredAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        eventType:
          type: string
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/BookingStatus'
            - type: 'null'
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/BookingStatus'
            - type: 'null'
        actorKind:
          type: string
          enum: [CUSTOMER, MEMBER, AI, SYSTEM]
        actorMembershipId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reason:
          type: [string, 'null']
        lateChangeKind:
          type: [string, 'null']
          enum: [LATE_CANCELLATION, LATE_RESCHEDULE, null]
        occurredAt:
          $ref: '#/components/schemas/Instant'
      additionalProperties: false
    BookingEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingEvent'
      additionalProperties: false
    AgendaView:
      type: object
      required: [from, to, timezone, resources, bookings, exceptions]
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        timezone:

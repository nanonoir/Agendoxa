        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrmBookingRequest'
            examples:
              walkInNewCustomer:
                $ref: '#/components/examples/CreateCrmBookingRequest'
      responses:
        '201':
          description: Booking created and confirmed.
          headers:
            Location:
              description: URL of the new booking.
              schema:
                type: string
          content:
            application/json:
              schema:

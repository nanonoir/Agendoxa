              schema:
                $ref: '#/components/schemas/RescheduleResult'
              examples:
                lowerRequirement:
                  $ref: '#/components/examples/RescheduleResultLowerRequirement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':

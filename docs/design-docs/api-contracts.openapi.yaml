    post:
      tags: [bookings]
      operationId: rescheduleBooking
      x-agendoxa-invokes:
        coordinator: workflows
        participants: [bookings, payments, notifications]
      summary: Move a confirmed booking to a new slot, service or resource
      description: |
        Checks the target without releasing the current slot; the move and release are atomic
        (BR-CAN-08, BR-CAN-12). If the destination's current requirement exceeds the valid
        allocations, the shortfall is returned as `supplementalDeposit` and requested afterwards;
        it never undoes the move (BR-CAN-10). A lower requirement refunds or credits nothing: the
        retained allocations simply reduce the balance and `supplementalDeposit` is `null`
        (BR-CAN-11). The result is assembled from the participants' results in the same
        transaction (API-DM-25).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'

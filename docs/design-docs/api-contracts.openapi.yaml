  /tenants/{tenantId}/payment-reviews/{reviewId}/approve:
    post:
      tags: [payments]
      operationId: approvePaymentReview
      x-agendoxa-invokes:
        coordinator: workflows
        participants: [payments, bookings, notifications]
      summary: Record that a person verified the actual credit
      description: |
        Creates exactly one verified TRANSFER payment linked to the review (INV-PAY-10) and the
        allocations listed, never others. For an active booking the person confirms the
        allocation in this same action, up to the amount owed (BR-SEN-07, BR-COB-03–04,
        INV-SEN-14, EJ-20): leaving payable debt unallocated is `422 allocation_required`.
        `allocations: []` with an `unallocatedReason` is accepted only for excess, money not
        matched to the booking, or a booking already expired or cancelled (BR-COB-02, BR-COB-17).
        Only the listed allocations can reach the threshold and confirm the booking. Approval stays
        human-only; the agent never reaches it.
      security:
        - sessionCookie: []
          csrfToken: []

    post:
      tags: [payments]
      operationId: recordPayment
      x-agendoxa-invokes:
        coordinator: workflows
        participants: [payments, bookings, notifications]
      summary: Record verified money received in cash, or a transfer whose credit was checked
      description: |
        No review is needed when personnel verify directly (BR-COB-04, BR-COB-08). A payment, TRANSFER
        or CASH, recorded for an active booking carries its allocation in the same action, up to the
        amount owed (BR-SEN-07, INV-SEN-14). Cash needs an open session. The tenant's first session
        is always opened manually with an explicit opening amount, so a cash payment with no open
        session and no earlier close is `409 cash_session_not_open` even when automatic opening is
        configured; once a counted close exists, automatic opening uses it (BR-CAJA-03,
        API-DM-22). The payment and its cash movement are the same money. Allocations are only
        those listed.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
            examples:
              cashBalance:
                $ref: '#/components/examples/RecordPaymentRequestCash'
      responses:
        '201':
          description: Recorded.
          headers:
            Location:
              description: URL of the new payment.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency conflict, or the cash session does not allow the payment (`cash_session_not_open`, including the tenant's first cash payment before any manual opening).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                firstCashPayment:
                  $ref: '#/components/examples/ProblemCashSessionNotOpen'
        '422':
          $ref: '#/components/responses/AllocationRuleViolation'

          description: A page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [payments]
      operationId: openCashSession
      summary: Open the shared cash session manually
      description: |
        At most one open session per tenant (INV-CAJA-01). Opening cash is declared the first time
        and reconciled with the previous close afterwards (BR-CAJA-03). The tenant's first session
        can only be opened here, with an explicit `openingAmount`: no implicit 0.00 and no automatic
        opening without a previous counted close (API-DM-22).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCashSessionRequest'
      responses:
        '201':
          description: Opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/RuleViolation'
  /tenants/{tenantId}/cash-sessions/current:
    get:
      tags: [payments]
      operationId: getCurrentCashSession
      summary: The open session, if any, and the previous close to reconcile with
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Current cash context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCashSessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/cash-sessions/{sessionId}:
    get:
      tags: [payments]
      operationId: getCashSession
      summary: Get a cash session with its totals and adjustments
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CashSessionId'
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenants/{tenantId}/cash-sessions/{sessionId}/close:
    post:
      tags: [payments]
      operationId: closeCashSession
      summary: Close the session manually with the counted cash
      description: |
        Records counted cash, expected cash and the difference, which is allowed (BR-CAJA-04,
        BR-CAJA-06). `expectedRevision` must match the session the person reviewed (API-DM-18).
        Unpaid bookings never block the close. The closed session is immutable.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CashSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCashSessionRequest'
            examples:
              countedWithDifference:
                $ref: '#/components/examples/CloseCashSessionRequest'
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
              examples:
                closedWithDifference:
                  $ref: '#/components/examples/CashSessionClosed'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleRevision'
  /tenants/{tenantId}/cash-sessions/{sessionId}/movements:
    get:
      tags: [payments]
      operationId: listCashMovements
      summary: Physical cash movements of a session, in order of occurrence
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CashSessionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of movements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovementPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [payments]
      operationId: recordCashMovement
      summary: Record a cash-in or cash-out with a reason
      description: Only in the open session. Cash payments and refunds create their own movements; they are not recorded here (BR-CAJA-05).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CashSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCashMovementRequest'
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenants/{tenantId}/cash-sessions/{sessionId}/adjustments:
    post:
      tags: [payments]
      operationId: recordCashAdjustment
      summary: Admin-only audited adjustment to a closed cash session
      description: |
        Appended to a closed session for a physical-cash correction; the close and the original
        payment stay unchanged (BR-CAJA-09, BR-COB-11, EJ-21). Not a general financial log or a
        refund. `expectedRevision` must match the session the Admin reviewed (API-DM-18).
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CashSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCashAdjustmentRequest'
      responses:
        '201':
          description: Adjustment appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashAdjustment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleRevision'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: agendoxa_session
      description: Opaque server-side session set by `POST /session` (API-DM-06).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token from the session response; required on every non-safe method.
  headers:
    PublicCacheControl:
      description: Public data may be cached briefly.
      schema:
        type: string
        example: public, max-age=300
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Selects the business; access requires an active membership, revalidated on every request.
      schema:
        $ref: '#/components/schemas/Uuid'
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        maxLength: 63
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CalendarId:
      name: calendarId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CashSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated, unique per intended operation; a retry reuses it (API-DM-10).
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    IncludeInactive:
      name: includeInactive
      in: query
      required: false
      schema:
        type: boolean
        default: false
    FromDate:
      name: from
      in: query
      required: true
      description: First local date, inclusive, in the tenant timezone.
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToDate:
      name: to
      in: query
      required: true
      description: Last local date, inclusive. Agenda and free slots accept at most 14 days; windows at most 31.
      schema:
        $ref: '#/components/schemas/LocalDate'
    FromInstant:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Instant'
    ToInstant:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Instant'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque value from `nextCursor`; valid only with the same filters.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    ValidationError:
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidPhone:
              $ref: '#/components/examples/ProblemValidation'
    Unauthorized:
      description: No valid session, or invalid credentials on sign-in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Valid membership, but the role lacks the permission, or the operation is Admin-only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            adminOnly:
              $ref: '#/components/examples/ProblemForbidden'
    NotFound:
      description: Not found, including records of another tenant and tenants without an active membership.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            otherTenant:
              $ref: '#/components/examples/ProblemNotFound'
    Conflict:
      description: Current state prevents the operation, such as an occupied slot or a reused idempotency key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            slotTaken:
              $ref: '#/components/examples/ProblemSlotUnavailable'
    RuleViolation:
      description: The request is valid, but a business rule rejects it now.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lateCancellation:
              $ref: '#/components/examples/ProblemLateChange'
    AllocationRuleViolation:
      description: An allocation exceeds the charge balance or the payment's available funds, or another business rule rejects the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            exceedsBalance:
              $ref: '#/components/examples/ProblemAllocationExceeds'
    StaleRevision:
      description: The cash session changed after the caller reviewed it, or its status does not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            sessionChanged:
              $ref: '#/components/examples/ProblemStaleRevision'
  schemas:
    Uuid:
      type: string
      format: uuid
    Instant:
      description: UTC instant, RFC 3339 with a `Z` suffix.
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
    LocalDate:
      description: Calendar date in the tenant timezone.
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    LocalTime:
      description: Wall-clock time in the tenant timezone, 24-hour `HH:mm`.
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    Money:
      description: Exact non-negative decimal with two places in the tenant currency.
      type: string
      pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
    Percentage:
      description: Exact decimal percentage from 0.01 to 100.00 inclusive, two places; zero is not a percentage here.
      type: string
      pattern: '^(100\.00|(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]?\.[0-9]{2}))$'
    PositiveMoney:
      description: Money greater than zero, for payments, allocations and movements.
      type: string
      pattern: '^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,9}\.[0-9]{2})$'
    SignedMoney:
      description: Exact signed decimal with two places, for differences and signed cash amounts.
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
    NonZeroSignedMoney:
      type: string
      pattern: '^-?(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,9}\.[0-9]{2})$'
    Minutes:
      type: integer
      minimum: 0
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{1,14}$'
    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    Reason:
      type: string
      minLength: 1
      maxLength: 500
    BookingStatus:
      description: The seven statuses of `booking_status`; only the bookings module changes them.
      type: string
      enum: [HOLD, PENDING_PAYMENT_REVIEW, CONFIRMED, CANCELLED, EXPIRED, COMPLETED, NO_SHOW]
    DepositState:
      description: |
        Derived from the booking and payment facts; never a booking status (API-DM-13).
        AWAITING_EVIDENCE also covers a first clearly unrelated file and evidence still under
        preliminary screening. UNDER_REVIEW means human review, whatever routed the evidence
        there; CORRECTION_WINDOW follows a human rejection only. No value is a screening verdict
        (BR-SEN-14–16). There is no "verified but unallocated" value: verifying money for an
        active booking allocates it in the same human action, up to the amount owed (BR-SEN-07,
        INV-SEN-14; API-Q-13 closed). It describes the initial deposit only; a supplement
        after a reschedule is `supplementalDepositState` (API-DM-21). The value describes the
        initial-deposit allocations against the threshold and the evidence, not the booking
        status, which comes from `status`. Conditions can overlap, so the value is the first
        that matches, in this order: 1 NOT_REQUIRED (no deposit applies); 2 ADMIN_EXCEPTION;
        3 MET (valid allocations reach the threshold, even if more evidence is in review);
        4 UNDER_REVIEW (initial-deposit evidence in human review, even with some allocations
        left, e.g. a resent receipt after a partial reversal); 5 CORRECTION_WINDOW (only without
        verified funds, never after a reversal, so it cannot overlap 6 or 7); 6 PARTIAL
        (allocated above zero and below the threshold); 7 UNALLOCATED (a personnel reversal,
        BR-SEN-18, API-Q-14 closed, left none); 8 AWAITING_EVIDENCE (everything else with a
        deposit, including evidence still under preliminary screening). The allocated amount
        stays visible in `deposit.allocated` whichever value is selected. A not-yet-started booking so returned to PENDING_PAYMENT_REVIEW has no window, expiry or automatic release;
        only invalid verification requests another receipt, not reassignment of valid funds
        (BR-SEN-18). A
        started or completed booking keeps its status, is not asked to resend, and shows PARTIAL
        or UNALLOCATED rather than a stale MET.
      type: string
      enum: [NOT_REQUIRED, AWAITING_EVIDENCE, UNDER_REVIEW, CORRECTION_WINDOW, PARTIAL, UNALLOCATED, MET, ADMIN_EXCEPTION]
    SupplementalDepositState:
      description: |
        Additional deposit requested after a permitted reschedule of a CONFIRMED booking
        (BR-CAN-10). Never confirms, unconfirms or cancels; a rejected supplemental receipt
        returns to REQUESTED without a correction window (BR-SEN-10, CU-09 A3). NOT_COLLECTED is
        terminal: personnel closed the request without collecting it (BR-CAN-15, API-DM-26); the
        deposit, price and CONFIRMED status are unchanged.
      type: string
      enum: [REQUESTED, UNDER_REVIEW, MET, NOT_COLLECTED]
    RestrictionKind:
      type: string
      enum: [FULL_PREPAYMENT, BLOCKED]
    Problem:
      description: RFC 9457 problem details (API-DM-09).
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum: [validation, unauthorized, forbidden, not_found, conflict, rule_violation, external_dependency, internal]
        reason:
          description: Stable snake_case reason within the code, listed per endpoint in the document.
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
        lateChange:
          $ref: '#/components/schemas/LateChangeNotice'
        currentRevision:
          description: With reason `stale_revision`, the revision the session has now (API-DM-18).
          type: integer
          minimum: 0
        allocationLimit:
          $ref: '#/components/schemas/AllocationLimit'
      additionalProperties: false
    AllocationLimit:
      description: With an allocation reason, the current caps of the first item that fails.
      type: object
      required: [index, chargeBalance, availableFunds]
      properties:
        index:
          description: Position of the item in the request's `allocations`.
          type: integer
          minimum: 0
        chargeBalance:
          $ref: '#/components/schemas/Money'
        availableFunds:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    LateChangeNotice:
      description: Returned with reason `late_change_requires_acceptance` so the CRM can show the consequence.
      type: object
      required: [noticeMinutes, startAt, depositRefundPolicy]
      properties:
        noticeMinutes:
          $ref: '#/components/schemas/Minutes'
        startAt:
          $ref: '#/components/schemas/Instant'
        depositRefundPolicy:
          type: [string, 'null']
          enum: [NO_MONEY_BACK, REFUND_POSSIBLE, null]
      additionalProperties: false
    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
      additionalProperties: false
    MembershipSummary:
      type: object
      required: [membershipId, tenantId, tenantName, tenantSlug, roleName]
      properties:
        membershipId:
          $ref: '#/components/schemas/Uuid'
        tenantId:
          $ref: '#/components/schemas/Uuid'
        tenantName:
          type: string
        tenantSlug:
          type: string
        roleName:
          type: string
      additionalProperties: false
    SessionView:
      type: object
      required: [user, memberships, csrfToken]
      properties:
        user:
          type: object
          required: [id, email, fullName]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            email:
              type: string
              format: email
            fullName:
              type: string
          additionalProperties: false
        memberships:
          description: Active memberships only; nothing about other installations.
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
        csrfToken:
          type: string
      additionalProperties: false
    TenantContextView:
      type: object
      required: [tenantId, membershipId, role, permissions]
      properties:
        tenantId:
          $ref: '#/components/schemas/Uuid'
        membershipId:
          $ref: '#/components/schemas/Uuid'
        role:
          type: object
          required: [id, name, systemKey]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            systemKey:
              type: [string, 'null']
              enum: [ADMIN, STAFF, null]
          additionalProperties: false
        permissions:
          description: Effective permission keys; the catalog is defined with identity (API-Q-02).
          type: array
          items:
            type: string
      additionalProperties: false
    TenantProfile:
      type: object
      required: [id, name, slug, timezone, currency, branding]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        slug:
          type: string
        timezone:
          description: IANA timezone name.
          type: string
        currency:
          description: ISO 4217 code; one currency per tenant.
          type: string
          pattern: '^[A-Z]{3}$'
        branding:
          type: [string, 'null']
      additionalProperties: false
    UpdateTenantProfileRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        branding:
          type: [string, 'null']
          maxLength: 2000
      additionalProperties: false
    WeeklyHours:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
      additionalProperties: false
    PublicBusinessProfile:
      type: object
      required: [name, slug, timezone, branding, location, whatsappUrl, regularHours]
      properties:
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        branding:
          type: [string, 'null']
        location:
          description: |
            Public location text of the business, with an optional Maps link; null until the
            business sets it. Proposed (product-owner agreement 2026-11-12): the address belongs
            to `tenants` and is pending adoption in the ERD (DOM-01); it is not migrated (API-Q-01).
          oneOf:
            - $ref: '#/components/schemas/PublicLocation'
            - type: 'null'
        whatsappUrl:
          description: |
            `wa.me` link built from the tenant's connected WhatsApp number (digits of the E.164
            number, no `+`); null when no connection is active. The number is a `messaging` fact.
          type: [string, 'null']
          format: uri
        regularHours:
          description: Tenant calendar weekly hours. No availability or occupancy.
          type: array
          items:
            $ref: '#/components/schemas/WeeklyHours'
      additionalProperties: false
    PublicLocation:
      description: Public business address as text, plus an optional Maps link. Never a customer or private address.
      type: object
      required: [address, mapsUrl]
      properties:
        address:
          type: string
          minLength: 1

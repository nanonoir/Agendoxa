  /tenants/{tenantId}/payment-allocations/{allocationId}/reversal:
    post:
      tags: [payments]
      operationId: reversePaymentAllocation
      x-agendoxa-invokes:
        coordinator: workflows
        participants: [payments, bookings, notifications]
      summary: Reverse an allocation, keeping it in history
      description: |
        The allocation becomes REVERSED and its funds available again; it never cancels a booking.
        If it leaves a CONFIRMED booking that has not started below its initial-deposit threshold
        (fully or partially), the same transaction returns the booking to PENDING_PAYMENT_REVIEW
        (unconfirmed, occupying). Invalid-verification reversal queues a resend notice in the
        same transaction; reassignment of valid funds never requests another receipt from the
        payer, even for the same customer. The backend uses the trusted persisted correction
        cause; private staff reasons are not exposed to the agent (BR-SEN-18, INV-SEN-15; the
        cause-specific notice is BR-SEN-18).
        There is no correction window, expiry or automatic release, even after rejection of
        resent evidence. A started or completed booking retains its status and gets no resend
        notice; an Admin exception and the supplemental deposit are not changed. Multi-owner command of `workflows`; the response
        is assembled in the transaction (API-DM-24, API-DM-25). 409 `state_changed` when the
        booking changed meanwhile, `allocation_already_reversed` when already reversed.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AllocationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseAllocationRequest'
      responses:
        '200':
          description: Reversed; the payment with its allocations, the reversed one included, and the affected bookings after any return to review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

      operationId: createCrmBooking
      x-agendoxa-invokes:
        coordinator: workflows
        participants: [bookings, customers, payments, notifications]
      summary: Create a CRM booking (walk-in or on behalf of a customer)
      description: |
        Confirmed directly, with no HOLD, when no deposit is required or an Admin grants the
        existing deposit exception (BR-RES-09, BR-SEN-09). Recording payments or receipts
        for a deposit belongs to the payments increment.
      security:
        - sessionCookie: []
          csrfToken: []

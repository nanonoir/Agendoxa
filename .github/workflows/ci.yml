name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:check

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agendoxa_test
          POSTGRES_PASSWORD: agendoxa_test
          POSTGRES_DB: agendoxa_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agendoxa_test -d agendoxa_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway credentials for the ephemeral service container only.
      DATABASE_URL_TEST: postgres://agendoxa_test:agendoxa_test@127.0.0.1:5433/agendoxa_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
